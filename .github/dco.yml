# Конфигурация DCO-бота (GitHub App "DCO", probot/dco).
#
# Проект использует Developer Certificate of Origin 1.1 вместо CLA.
# Полный текст DCO и обоснование решения: docs/legal/licensing.md, раздел 5.
#
# Каждый коммит в PR обязан содержать строку `Signed-off-by: Имя <email>`
# (`git commit -s`). Проверка обязательна для мержа — статус-чек `DCO`
# должен быть включён в branch protection основной ветки.

# Требовать подпись в том числе от членов организации.
# false — освободило бы мейнтейнеров от подписи; для AGPL-проекта
# происхождение вклада должно быть зафиксировано у всех одинаково.
require:
  members: true

# Разрешить исправление забытой подписи отдельным remediation-коммитом,
# без rebase всей ветки — снижает барьер для внешних контрибьюторов.
allowRemediationCommits:
  # Автор коммита сам подтверждает свои же прошлые коммиты.
  individual: true
  # Подпись за третье лицо запрещена: подтвердить происхождение вклада
  # может только его автор.
  thirdParty: false
