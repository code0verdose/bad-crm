# Dependabot version updates.
#
# Story: STORY-002-06. Epic: EPIC-002. Policy: rules/dependencies.mdc §13.
#
# Four shapes of noise are managed here on purpose:
#   * grouping — patch and minor updates arrive as one pull request per group, so a normal
#     week is three or four pull requests rather than twenty;
#   * majors stay ungrouped — a major is read against its migration guide and reviewed on
#     its own (rules/dependencies.mdc §3), which is impossible inside a batch;
#   * cooldown — a freshly published version is not installed the same day. Most
#     compromised npm releases are yanked within days, and rules/dependencies.mdc §6 puts
#     malware above freshness;
#   * a carve-out — a dependency that has demonstrably taken a whole group hostage gets a
#     group of its own, so the next failure names itself instead of holding seven innocent
#     updates behind a bisect nobody can run.
#
# Dependabot pull requests run the full CI, including the licence and audit gates, and are
# never merged automatically.
version: 2

updates:
  # ── npm / pnpm workspaces ────────────────────────────────────────────────────────────
  # One entry at the root: pnpm-lock.yaml is a single workspace-wide lockfile, and
  # Dependabot resolves `packages/*` manifests through it. Per-package entries would
  # produce conflicting updates of the same lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 7
    commit-message:
      # `deps` is the only dependency scope allowed by commitlint.config.js; the default
      # `include: scope` would emit `deps-dev`, which the scope-enum rejects.
      prefix: chore(deps)
      prefix-development: chore(deps)
    groups:
      # TanStack Router, carved out of `dev` and `prod-patch` and listed first — a dependency
      # joins the first group whose rules it matches.
      #
      # Why it is separate. On 2026-08-12 the `prod-patch` batch carried
      # `@tanstack/react-router` 1.170.18 → 1.170.24 together with seven unrelated patches, and
      # the client suite went red while `end-to-end` stayed green in a real browser. The same
      # week the `dev` batch carried `@tanstack/router-plugin` and failed with the identical
      # signature. Grouped, the failure is a bisect across eight lockfile entries that nobody can
      # run locally — the lockfile is regenerated on Dependabot's side. Alone, it is one pull
      # request that either passes or names its own culprit.
      #
      # Why runtime and plugin sit in the *same* group rather than one each: the plugin generates
      # the route tree the runtime consumes. Moving them in separate pull requests would install
      # a generator and a runtime from different release trains, and a skew neither pull request
      # can reproduce on its own is worse than the batch this carve-out is fixing. No
      # `dependency-type` here for exactly that reason — the runtime is a dependency, the plugin
      # a devDependency, and the group has to span both.
      tanstack-router:
        patterns:
          - '@tanstack/react-router'
          - '@tanstack/react-router-*'
          - '@tanstack/router-*'
        update-types: [minor, patch]
      dev:
        dependency-type: development
        update-types: [minor, patch]
      prod-patch:
        dependency-type: production
        update-types: [patch]
      prod-minor:
        dependency-type: production
        update-types: [minor]

  # ── GitHub Actions ───────────────────────────────────────────────────────────────────
  # Every action in this repository is pinned to a commit SHA with the tag in a comment.
  # Dependabot moves the SHA and rewrites the comment, which is exactly why pinning by SHA
  # does not have to mean going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]

  # ── Docker images in docker-compose.yml ──────────────────────────────────────────────
  # The compose file is part of the distribution, not a developer convenience: the tags
  # here are what every installation pulls. Majors stay ungrouped — for Redis a major is a
  # licensing question first and an upgrade second (docs/legal/licensing.md §4: only the
  # 8.x line offers an AGPLv3 branch, 7.4 is RSALv2/SSPLv1 and forbidden).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
    commit-message:
      prefix: build(docker)
    groups:
      docker-images:
        patterns: ['*']
        update-types: [minor, patch]
