# Bad CRM — the gate every pull request has to pass.
#
# The contract with contributors is `rules/ci-before-push.mdc`: one command, the full set, from the
# repository root. This workflow runs that same command — not a hand-written sequence of package
# scripts — so that "green locally" and "green on main" cannot mean different things. The
# assertions in `test/ci/workflow.test.ts` hold the two together: the task list below is compared
# against the one stated in the rule.
#
# No OS matrix on purpose. Bad CRM ships as a Linux container and is installed with
# `docker compose` (`rules/self-host-packaging.mdc`); a macOS or Windows leg would triple the
# minutes and the wall clock to test platforms nothing runs on. Node itself is pinned by `.nvmrc`,
# which is the difference this project actually cares about.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Only the `compat` job runs on this schedule. It checks the claim `engines.node` makes about
  # Node versions newer than the one CI pins, and that claim goes stale on the pace of Node
  # releases, not of commits — so a weekly run catches a break within days without taxing a pull
  # request. Monday morning UTC: a failure lands at the start of a working week, not into it.
  schedule:
    - cron: '17 6 * * 1'

# Read-only by default. Any job that needs more asks for it explicitly, at the job level.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled; pushes to main are not, because the run on a merge
  # commit is the record that the commit was ever checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Corepack downloads the pnpm release named by `packageManager` in package.json. The prompt is
  # interactive-only, but an unset variable has meant a hung runner often enough to be worth a line.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # NFR-9: nothing in this project phones home, including its build tools.
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  # Pinned by version *and* by checksum: the release archive is verified before it is unpacked, so
  # a replaced asset fails the step instead of running as root on the runner.
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  checks:
    name: typecheck, lint, build, test
    # The scheduled run exists for `compat` alone; re-running the same commit weekly proves nothing.
    if: github.event_name != 'schedule'
    # Pinned image rather than `ubuntu-latest`: a runner image rollover is a change to the build
    # environment and should arrive as a reviewable commit, not overnight.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # `.nvmrc` is the single source of the Node version — the same file nvm, the contributor
          # and `engines` already agree on (`test/repo/toolchain-versions.test.ts`). Repeating the
          # number here would create a second one, and CI is where the two would diverge silently.
          node-version-file: .nvmrc

      - name: Activate pnpm through Corepack
        # The version comes from `packageManager` in package.json, so the runner uses exactly the
        # pnpm a contributor uses. `pnpm/action-setup` would need that version repeated in an input.
        run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Restore the turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Turborepo 2.x keeps its filesystem cache in `.turbo/cache`; the rest of `.turbo` is
          # logs and daemon state, which must not be restored between runs.
          #
          # Remote Cache is deliberately not used: `docs/architecture/stack.md` rules out tying a
          # public repository to a vendor service. `actions/cache` buys most of it, with limits
          # worth knowing: a cache entry is immutable, so the key carries the commit SHA and the
          # prefix in `restore-keys` is what actually restores anything; a pull-request branch can
          # only read caches written by itself or by its base branch, so the first run of a new
          # branch warms up from main and a fork PR starts cold; and the repository quota is 10 GB
          # with least-recently-used eviction, so a busy week can evict an old branch's entry.
          # Every one of those degrades to a slower run, never to a wrong one — the cache key is
          # turbo's own content hash, and a miss just re-runs the task.
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install dependencies
        # A lockfile that does not match package.json fails here instead of being silently
        # recomputed into a different dependency tree than the one that was reviewed.
        run: pnpm install --frozen-lockfile

      - name: Run the full check set
        # The one command of `rules/ci-before-push.mdc`. `errors-only` keeps the log to the output
        # of tasks that failed; vitest adds its own GitHub annotations for failing specs, so the
        # names show up in the run without expanding a log.
        #
        # `lint` is four linters, not one: each package's ESLint, `//#lint:repo` for the files that
        # belong to no package, and `//#stylelint` for every stylesheet under `packages/*/src`. They
        # are attached through `dependsOn` in turbo.json rather than added to this command line on
        # purpose — `test/ci/workflow.test.ts` holds this step to exactly the task set stated in
        # `rules/ci-before-push.mdc`, so a linter that arrives as a fifth top-level task also has to
        # arrive in the rule. Hanging it off `lint` keeps one contract instead of two.
        run: pnpm turbo run typecheck lint build test --output-logs=errors-only

      - name: Regenerate the API types and require an empty diff
        # Contract-first, enforced (ADR-0003, step 5): `docs/api/openapi.yaml` is edited by hand and
        # `packages/client/src/shared/api/schemas/api-schema.d.ts` is generated from it and
        # committed. If the two disagree, the client compiles against a contract the server no
        # longer serves — so the specification moving without the types is a red build, not a
        # comment on a pull request.
        #
        # `--exit-code` is the whole gate: no `|| true`, no `continue-on-error`. The paths are
        # named so that an unrelated dirty file (a lockfile the installer touched) cannot fail this
        # step for the wrong reason.
        run: |
          set -euo pipefail
          pnpm api:gen
          if ! git diff --exit-code -- packages/client/src/shared/api/schemas; then
            {
              echo "### API types are out of date"
              echo
              echo 'The specification changed without regenerating the client types.'
              echo 'Run `pnpm api:gen` and commit `api-schema.d.ts` with the specification.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Check the translation catalogues
        # The parity gates already ran inside `test` above; this re-runs the two i18n files on their
        # own to get a clean exit for the summary step, then prints the table. The one thing it adds
        # is a key that exists in both languages and says nothing — present to every set comparison,
        # blank to every reader. `--silent` keeps pnpm's own banner out of the summary.
        run: pnpm --silent i18n:check >> "$GITHUB_STEP_SUMMARY"

      - name: Check coverage against the baseline
        # `--silent` so that pnpm's own `> bad-crm@0.0.0 …` banner does not land in the summary;
        # the table is written before the non-zero exit, so a regression is both visible and red.
        run: pnpm --silent coverage:baseline >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage reports
        # `always()`: the run where coverage matters most is the one that failed a threshold, and
        # the report is what says which lines.
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage/
            packages/*/coverage/
          retention-days: 14
          if-no-files-found: ignore

  scan:
    if: github.event_name != 'schedule'
    name: secrets and cruft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No `needs`: a failing test must not be able to skip the secret scan. The two jobs are
    # independent gates and both are required by branch protection.
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push scan walks every commit, and the pull-request scan needs the base commit to
          # diff against; neither is present in a shallow clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Activate pnpm through Corepack
        run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        # Only for `tsx`, which runs the cruft scanner. `--ignore-scripts` keeps this job from
        # executing any package's lifecycle script: it needs a resolver, not a build.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install gitleaks
        # The official action is not used: it requires `GITLEAKS_LICENSE` for repositories owned by
        # an organisation, and secrets are unavailable to pull requests from forks — the scan would
        # degrade exactly where an unknown contributor's diff needs it. The released binary has no
        # such condition, and pinning it by checksum is stronger than pinning an action by tag.
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan for secrets
        env:
          # A pull request is scanned as a diff — everything the branch adds on top of its base.
          # A push to main is scanned as history, so that a secret introduced before this workflow
          # existed is still found.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks-report.json"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            log_opts="--no-merges ${BASE_SHA}...${HEAD_SHA}"
          else
            log_opts="--all"
          fi
          # `--redact`: a finding must name the file, the line and the rule, and must never print
          # the value — a CI log is world-readable on a public repository, and echoing the secret
          # into it would make the leak worse than the commit did.
          "$RUNNER_TEMP/gitleaks" git . \
            --config .gitleaks.toml \
            --log-opts "$log_opts" \
            --redact \
            --no-banner \
            --report-format json \
            --report-path "$report" \
            --exit-code 2 || status=$?
          # 2 is the code this run asked for on a finding; anything else non-zero is the scanner
          # itself failing — an unreadable config, a bad range — and must not be reported as a leak.
          if [ "${status:-0}" -ne 0 ] && [ "${status:-0}" -ne 2 ]; then
            echo "gitleaks failed to run (exit ${status})" >&2
            exit 1
          fi
          if [ "${status:-0}" -eq 2 ]; then
            {
              echo "### Secret scan failed"
              echo
              echo "A value matching a secret pattern was found in this change."
              echo "The value itself is redacted here and in the artifact — read it from your"
              echo "working copy, not from this log."
              echo
              echo "Rotate first, clean the history second: \`docs/runbooks/incident.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload the redacted secret-scan report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report-${{ github.run_id }}
          path: ${{ runner.temp }}/gitleaks-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Scan for cruft
        # Runs even when the secret scan failed: both findings belong in the same report, and
        # fixing them is one pass over the diff, not two rounds of CI.
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --no-color "${BASE_SHA}...${HEAD_SHA}" > "$RUNNER_TEMP/diff.patch"
          elif git rev-parse --verify --quiet "${{ github.event.before }}^{commit}" > /dev/null; then
            git diff --no-color "${{ github.event.before }}..${{ github.sha }}" > "$RUNNER_TEMP/diff.patch"
          else
            # First push of a branch, or a force-push whose predecessor is gone: there is no range
            # to diff, so the whole commit is the change.
            git show --no-color --format= "${{ github.sha }}" > "$RUNNER_TEMP/diff.patch"
          fi
          set +e
          pnpm exec tsx scripts/ci/scan-cruft.ts --diff \
            < "$RUNNER_TEMP/diff.patch" >> "$GITHUB_STEP_SUMMARY"
          status=$?
          set -e
          # 2 — BLOCK level (breakpoint statements, focused specs, conflict markers): does not merge.
          # 1 — WARN level (task markers, debug prints, development endpoints): visible in the job
          #     summary for the reviewer, not a reason to stop the pipeline.
          #
          # The wording above avoids the literal patterns on purpose: this file is scanned like any
          # other, and a comment naming them would block the pull request that edits this step.
          if [ "$status" -ge 2 ]; then exit 1; fi

  # The RLS isolation suite. It is the only automated proof that invariant 1 of CLAUDE.md holds —
  # a tenant cannot read, write, move or count another tenant's rows — and it needs a real
  # PostgreSQL, because the property under test is a database policy, not application code.
  #
  # No `services:` block: Testcontainers starts the pgvector image itself, so the version under test
  # is the one `docker-compose.yml` pins rather than a second one declared here. GitHub runners ship
  # a Docker daemon on the standard socket, which is why the env passthrough that local runtimes
  # need (see `passThroughEnv` in turbo.json) is not repeated.
  #
  # Its own job rather than a step in `checks`: it costs a container start, and a failure here means
  # something different from a failing unit test — isolation, not logic.
  integration:
    name: database isolation
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Activate pnpm through Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the integration suite against a real PostgreSQL
        run: pnpm turbo run test:integration

  # The end-to-end run: the only job that drives the product the way a person does — a browser, a
  # real server, a real database, seeded data.
  #
  # Its own job rather than a step in `checks`, and for the same reason `integration` is one: it
  # costs a stack, and a failure here means something different from a failing unit test. It is also
  # the only place where the origin the client is served from matches `APP_URL` by construction,
  # which is what makes the saved-session scenarios meaningful (see `docs/runbooks/e2e.md`).
  #
  # Artifacts are asymmetric on purpose: the report always, the heavy things only when something
  # failed. A trace of a passing run is tens of megabytes nobody opens; a failure without one is a
  # screenshot and a guess.
  e2e:
    name: end-to-end
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Activate pnpm through Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The template is the source of truth for what an installation needs; the run starts from it,
      # so a variable added to the schema and forgotten in the template fails here rather than on
      # somebody's first install.
      #
      # The placeholders are then filled the way `docs/runbooks/install.md` §2.2 tells a person to
      # fill them — `openssl rand`, one value per `CHANGE_ME`. That keeps the runbook honest: if the
      # documented commands stop producing a configuration the schema accepts, this job is where it
      # shows, and the first person to install is not the one who finds out.
      - name: Configure the installation from the template
        run: |
          cp .env.example .env
          # The two with a required shape, by name: the schema wants exactly 32 base64 bytes for
          # one and a long string for the other (`docs/runbooks/install.md` §2.2).
          sed -i "s|^APP_ENCRYPTION_KEY=.*|APP_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48)|" .env
          # Everything else by **value**, not by line: the placeholders are coupled — the app_user
          # password appears in DATABASE_URL, the MinIO credentials in S3_ACCESS_KEY/S3_SECRET_KEY —
          # so substituting per line would leave a URL pointing at a password nobody set. Replacing
          # each placeholder string everywhere keeps the pairs consistent by construction.
          for placeholder in $(grep -E '^[A-Z_]+=' .env | grep -oE 'CHANGE_ME[A-Za-z0-9_]*' | sort -u); do
            sed -i "s|$placeholder|$(openssl rand -hex 24)|g" .env
          done
          # Assignments only: the file explains the placeholders in its comments, and those stay.
          ! grep -qE '^[A-Z_]+=.*CHANGE_ME' .env
          # Where the browser will be served from. `POST /auth/refresh` is the one endpoint a cookie
          # alone authorises, so it refuses an `Origin` that is not the installation's — and the
          # template ships `APP_URL=http://localhost:3000`, the API's own address, because a
          # container serves the built client from there. Here the client is a preview server on
          # 5173, so the installation is told that is where it lives. Getting this wrong produces a
          # valid session the application refuses to resume, which reads as a broken guard.
          sed -i "s|^APP_URL=.*|APP_URL=http://localhost:5173|" .env

      - name: Build the client and the server
        run: pnpm turbo run build

      - name: Start the backing services
        run: COMPOSE_PROFILES=minimal pnpm docker:up

      - name: Bootstrap the database roles, migrate and apply the grants
        run: |
          pnpm db:bootstrap
          pnpm db:migrate
          pnpm db:grants

      # The catalogue first: a role grants permissions **by name**, so seeding an organization before
      # the catalogue exists violates the foreign key. On an installation the order is the same —
      # §7c of the upgrade procedure runs before anybody creates anything.
      - name: Seed the permission catalogue
        run: pnpm db:seed:permissions

      - name: Seed the two organizations the scenarios sign in as
        run: pnpm db:seed

      - name: Install the browser the run uses
        run: pnpm --filter @bad-crm/e2e exec playwright install --with-deps chromium

      # Started here rather than through Playwright's `webServer` because the suite drives two
      # processes, not one, and the readiness of the pair is what `global-setup.ts` already proves.
      #
      # The server reads the configuration from the file the way a container would from its
      # environment: `--env-file-if-exists` rather than sourcing `.env` in the shell, because the
      # template carries trailing comments and shell sourcing would make them part of the value.
      # Output goes to files so the failure artifact can carry it — a stack that refused to start
      # otherwise leaves only «did not become ready».
      - name: Start the installation
        run: |
          mkdir -p packages/e2e/test-results
          nohup pnpm --filter @bad-crm/server exec \
            node --env-file-if-exists=../../.env dist/main.js \
            > packages/e2e/test-results/server.log 2>&1 &
          nohup pnpm --filter @bad-crm/client exec \
            vite preview --port 5173 --strictPort \
            > packages/e2e/test-results/client.log 2>&1 &

      - name: Run the end-to-end scenarios
        run: pnpm turbo run test:e2e

      - name: Collect the container logs
        if: failure()
        run: |
          mkdir -p packages/e2e/test-results
          docker compose logs --no-color --tail 500 > packages/e2e/test-results/containers.log

      # Before the upload, never after: an artifact bundle carrying a session file is a live refresh
      # cookie handed to whoever can read the build.
      - name: Scrub secrets from the artifacts
        if: always()
        run: |
          pnpm tsx scripts/ci/scrub-e2e-artifacts.ts packages/e2e/test-results --ephemeral
          pnpm tsx scripts/ci/scrub-e2e-artifacts.ts packages/e2e/playwright-report --ephemeral

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report-${{ github.run_id }}
          path: packages/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the traces, screenshots, videos and container logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-failure-${{ github.run_id }}
          path: packages/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  # `engines.node` declares a floor and no ceiling. That is a claim about every Node above the
  # floor, and an untested claim is how the previous ceiling got there: it was written by hand,
  # never measured, and quietly disabled the project's dependency updates — Dependabot runs its npm
  # updater on Node 24, could not satisfy the range, and answered every package with
  # `tool_version_not_supported`, so no security update could ever open a pull request.
  #
  # Not part of `checks`, and not a matrix on it: doubling the wall clock of every pull request buys
  # a signal that changes at the pace of Node releases. On the branch that gates merges and once a
  # week is fast enough to catch a break within a day, and the fix is either the code or a ceiling
  # put back with a measurement behind it.
  compat:
    name: newest supported Node
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Activate pnpm through Corepack
        run: corepack enable

      - name: Install dependencies
        # `engine-strict` is left on: refusing to install here is exactly the failure this job is
        # meant to surface, and silencing it would make the job green on the one thing it tests.
        run: pnpm install --frozen-lockfile

      - name: Run the full check set
        run: pnpm turbo run typecheck lint build test
